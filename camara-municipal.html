    <style>
      /* Featured candidates - larger size */
      .candidate-card-featured {
        transform: scale(1);
        transition: transform 0.3s ease;
        min-height: 280px; /* Força altura mínima maior */
      }

      .candidate-card-featured:hover {
        transform: scale(1.05);
      }

      .candidate-card-featured img {
        min-height: 280px; /* Imagens maiores para os principais */
        object-fit: cover;
      }

      /* Regular candidates - smaller size */
      .candidate-card {
        min-height: 180px; /* Altura menor para os restantes */
      }

      .candidate-card img {
        max-height: 180px; /* Imagens menores para os restantes */
        object-fit: cover;
      }

      /* Responsive adjustments */
      @media (max-width: 768px) {
        .candidate-card-featured {
          margin-bottom: 1rem;
          min-height: 240px;
        }

        .candidate-card-featured img {
          min-height: 240px;
        }

        .candidate-card {
          min-height: 150px;
        }

        .candidate-card img {
          max-height: 150px;
        }
      }

      @media (max-width: 480px) {
        .candidate-card-featured {
          min-height: 200px;
        }

        .candidate-card-featured img {
          min-height: 200px;
        }

        .candidate-card {
          min-height: 120px;
        }

        .candidate-card img {
          max-height: 120px;
        }
      }
    </style>

    <script src="./layout.js"></script>
  </body>

<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu Header</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body class="bg-gray-100">
    <!-- Header -->
    <header class="bg-slate-600 text-white shadow-lg">
      <div class="container mx-auto px-4">
        <div class="flex items-center justify-between h-16">
          <!-- Logo -->
          <a href="/" class="flex items-center space-x-3">
            <img
              src="./Seta vermelha.png"
              class="h-8"
              alt="Carlos Miranda Logo"
            />
            <span class="text-base font-semibold text-white whitespace-nowrap"
              >FORÇA PARA AVANÇAR</span
            >
          </a>

          <!-- Desktop Navigation -->
          <nav class="hidden md:flex items-center space-x-8">
            <div class="hidden md:flex items-center space-x-8">
              <a
                href="/freguesias.html"
                class="text-white hover:text-blue-400 transition nav-freguesias"
                >Freguesias</a
              >
              <a
                href="/propostas.html"
                class="text-white hover:text-blue-400 transition nav-propostas"
                >Assembleia</a
              >
              <a
                href="/noticias.html"
                class="text-white hover:text-blue-400 transition nav-noticias"
                >Notícias</a
              >
            </div>
          </nav>

          <!-- Social Media Icons - Desktop -->
          <div class="hidden md:flex items-center space-x-4">
            <a
              href="https://www.instagram.com/carlosmiranda.2025/"
              class="text-white hover:text-red-400 transition-colors duration-200"
            >
              <i class="fab fa-instagram text-xl"></i>
            </a>
            <a
              href="https://www.facebook.com/carlosmiranda.eleicoesautarquicas2025"
              class="text-white hover:text-red-400 transition-colors duration-200"
            >
              <i class="fab fa-facebook text-xl"></i>
            </a>
            <a
              href="https://www.youtube.com/@tempodeesperanca-carlosmir7337/featured"
              class="text-white hover:text-red-400 transition-colors duration-200"
            >
              <i class="fab fa-youtube text-xl"></i>
            </a>
          </div>

          <!-- Mobile menu button -->
          <div class="md:hidden">
            <button
              id="mobile-menu-button"
              class="text-white hover:text-red-400 focus:outline-none focus:text-red-400 transition-colors duration-200"
            >
              <i class="fas fa-bars text-xl"></i>
            </button>
          </div>
        </div>

        <!-- Mobile Navigation Menu -->
        <div id="mobile-menu" class="md:hidden hidden">
          <div class="px-2 pt-2 pb-3 space-y-1 border-t border-slate-500">
            <a
              href="/freguesias.html"
              class="block px-3 py-2 text-white hover:text-red-400 hover:bg-slate-700 rounded transition-colors duration-200 font-medium"
              >Freguesias</a
            >
            <a
              href="/propostas.html"
              class="block px-3 py-2 text-white hover:text-red-400 hover:bg-slate-700 rounded transition-colors duration-200 font-medium"
              >Assembleia</a
            >
            <a
              href="#"
              class="block px-3 py-2 text-white hover:text-red-400 hover:bg-slate-700 rounded transition-colors duration-200 font-medium"
              >Notícias</a
            >

            <!-- Social Media Icons - Mobile -->
            <div
              class="flex items-center space-x-6 px-3 py-3 border-t border-slate-500 mt-3"
            >
              <span class="text-sm text-slate-300">Siga-nos:</span>
              <a
                href="https://www.instagram.com/carlosmiranda.2025/"
                class="text-white hover:text-red-400 transition-colors duration-200"
              >
                <i class="fab fa-instagram text-xl"></i>
              </a>
              <a
                href="https://www.facebook.com/carlosmiranda.eleicoesautarquicas2025"
                class="text-white hover:text-red-400 transition-colors duration-200"
              >
                <i class="fab fa-facebook text-xl"></i>
              </a>
              <a
                href="https://www.youtube.com/@tempodeesperanca-carlosmir7337/featured"
                class="text-white hover:text-red-400 transition-colors duration-200"
              >
                <i class="fab fa-youtube text-xl"></i>
              </a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Conteúdo de exemplo -->
    <main class="container mx-auto px-4 py-8">
      <h2 class="text-3xl font-bold text-gray-800 mb-4">Bem-vindos</h2>
      <p class="text-gray-600 text-lg">
        Este é um exemplo do menu header responsive com funcionalidade de
        hamburger para mobile.
      </p>
    </main>

    <script>
      // Toggle mobile menu
      const mobileMenuButton = document.getElementById("mobile-menu-button");
      const mobileMenu = document.getElementById("mobile-menu");
      const menuIcon = mobileMenuButton.querySelector("i");

      mobileMenuButton.addEventListener("click", function () {
        mobileMenu.classList.toggle("hidden");

        // Toggle between hamburger and X icon
        if (mobileMenu.classList.contains("hidden")) {
          menuIcon.className = "fas fa-bars text-xl";
        } else {
          menuIcon.className = "fas fa-times text-xl";
        }
      });

      // Close mobile menu when clicking outside
      document.addEventListener("click", function (event) {
        const isClickInsideMenu = mobileMenu.contains(event.target);
        const isClickOnButton = mobileMenuButton.contains(event.target);

        if (
          !isClickInsideMenu &&
          !isClickOnButton &&
          !mobileMenu.classList.contains("hidden")
        ) {
          mobileMenu.classList.add("hidden");
          menuIcon.className = "fas fa-bars text-xl";
        }
      });

      // Close mobile menu when resizing to desktop
      window.addEventListener("resize", function () {
        if (window.innerWidth >= 768) {
          mobileMenu.classList.add("hidden");
          menuIcon.className = "fas fa-bars text-xl";
        }
      });
    </script>
  </body>
</html>

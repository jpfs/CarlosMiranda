<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freguesias - Carlos Miranda</title>
    <link rel="icon" type="image/png" href="./photos.main/Seta.vermelha.png" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.0/flowbite.min.js"></script>

    <meta name="title" content="Carlos Miranda - Força para avançar" />
    <meta
      name="description"
      content="Candidato a Presidente da Câmara Municipal da Sertã"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://carlosmiranda2025.pt/" />
    <meta property="og:title" content="Carlos Miranda - Força para avançar" />
    <meta
      property="og:description"
      content="Candidato a Presidente da Câmara Municipal da Sertã"
    />
    <meta property="og:image" content="./photos.main/Banner.SEO.png" />

    <!-- X (Twitter) -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://carlosmiranda2025.pt/" />
    <meta
      property="twitter:title"
      content="Carlos Miranda - Força para avançar"
    />
    <meta
      property="twitter:description"
      content="Candidato a Presidente da Câmara Municipal da Sertã"
    />
    <meta property="twitter:image" content="./photos.main/Banner.SEO.png" />
  </head>

  <body class="bg-gray-50">
    <div id="main">
      <!-- Header Section -->
      <section class="bg-gradient-to-r from-slate-800 to-slate-700 py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="text-center">
            <h1 class="text-4xl md:text-4xl font-bold text-white">
              Candidatos a Presidente de Junta
            </h1>
            <h2 class="text-2xl md:text-2xl text-white">
              Freguesias da Sertã:
            </h2>
          </div>
        </div>
      </section>

      <!-- Freguesias Grid -->
      <section class="py-16">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-4">
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Cabeçudo -->
            <article
              class="freguesia-card rounded-2xl h-80 mb-12 cursor-pointer"
              style="background-image: url('./photos/cabeçudo.png')"
            >
              <div
                class="freguesia-content h-115 flex flex-col justify-end text-center mb-30"
              >
                <h3>Cabeçudo</h3>
              </div>
            </article>

            <!-- Castelo -->
            <article
              class="freguesia-card rounded-2xl h-80 mb-12 cursor-pointer"
              style="background-image: url('./photos/castelo.png')"
            >
              <div
                class="freguesia-content h-115 flex flex-col justify-end text-center"
              >
                <h3>Castelo</h3>
              </div>
            </article>

            <!-- Cernache do Bonjardim -->
            <article
              class="freguesia-card rounded-2xl h-80 mb-12 cursor-pointer"
              style="background-image: url('./photos/cernache.png')"
            >
              <div
                class="freguesia-content h-115 flex flex-col justify-end text-center mt-6"
              >
                <h3>Cernache do Bonjardim <br />Nesperal e Palhais</h3>
              </div>
            </article>

            <!-- Cumeada -->
            <article
              class="freguesia-card rounded-2xl h-80 mb-12 cursor-pointer"
              style="background-image: url('./photos/cumeada.png')"
            >
              <div
                class="freguesia-content h-115 flex flex-col justify-end text-center"
              >
                <h3>Cumeada e Marmeleiro</h3>
              </div>
            </article>

            <!-- Ermida -->
            <article
              class="freguesia-card rounded-2xl h-80 mb-12 cursor-pointer"
              style="background-image: url('./photos/ermida.png')"
            >
              <div
                class="freguesia-content h-115 flex flex-col justify-end text-center"
              >
                <h3>Ermida e Figueiredo</h3>
              </div>
            </article>

            <!-- Pedrógão Pequeno -->
            <article
              class="freguesia-card rounded-2xl h-80 mb-12 cursor-pointer"
              style="background-image: url('./photos/pedrogão.png')"
            >
              <div
                class="freguesia-content h-115 flex flex-col justify-end text-center"
              >
                <h3>Pedrógão Pequeno</h3>
              </div>
            </article>

            <!-- Sertã -->
            <article
              class="freguesia-card rounded-2xl h-80 mb-12 cursor-pointer"
              style="background-image: url('./photos/serta.png')"
            >
              <div
                class="freguesia-content h-115 flex flex-col justify-end text-center"
              >
                <h3>Sertã</h3>
              </div>
            </article>

            <!-- Troviscal -->
            <article
              class="freguesia-card rounded-2xl h-80 mb-12 cursor-pointer"
              style="background-image: url('./photos/troviscal.png')"
            >
              <div
                class="freguesia-content h-115 flex flex-col justify-end text-center"
              >
                <h3>Troviscal</h3>
              </div>
            </article>

            <!-- Várzea dos Cavaleiros -->
            <article
              class="freguesia-card rounded-2xl h-80 mb-12 cursor-pointer"
              style="background-image: url('./photos/varzea.png')"
            >
              <div
                class="freguesia-content h-115 flex flex-col justify-end text-center"
              >
                <h3>Várzea dos Cavaleiros</h3>
              </div>
            </article>
          </div>
        </div>
      </section>
    </div>
    <script src="./layout.js"></script>
  </body>
</html>
